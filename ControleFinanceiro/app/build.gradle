// Arquivo de build no nível do MÓDULO (app).
// Aqui configuramos o SDK, e todas as bibliotecas (dependencies) usadas no app.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt' // Necessário para o Room gerar código em tempo de compilação
}

android {
    namespace 'com.example.controlefinanceiro'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.controlefinanceiro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true // Permite acessar as views do XML de forma segura, sem findViewById
    }
}

dependencies {
    // Bibliotecas básicas do Android/Kotlin
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView -> usado para exibir a lista de lançamentos
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ViewModel e LiveData -> parte do padrão MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Room -> banco de dados local (SQLite) usado para persistência
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1' // Extensões Kotlin (coroutines) para o Room
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines -> usadas para rodar operações de banco fora da thread principal
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
